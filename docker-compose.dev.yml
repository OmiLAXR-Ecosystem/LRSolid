services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lrsolid
      POSTGRES_PASSWORD: lrsolid
      POSTGRES_DB: lrsolid
    ports: ["${DEV_POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrsolid"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      PORT: "8080"
      PG_DSN: "postgres://lrsolid:lrsolid@postgres:5432/lrsolid?sslmode=disable"
      JWT_SECRET: "dev-only-insecure-secret-change-me"
      DEFAULT_ORG: "default"
      PLUGINS_DIR: "/plugins"
      EXPORT_S3_UPLOAD_BASE_URL: "http://rustfs:9000/${DEV_S3_BUCKET:-lrsolid}"
      EXPORT_S3_ACCESS_KEY: "${DEV_S3_ACCESS_KEY:-rustfsadmin}"
      EXPORT_S3_SECRET_KEY: "${DEV_S3_SECRET_KEY:-rustfsadmin}"
      EXPORT_S3_REGION: "us-east-1"
    volumes:
      # Mount entire repo so air sees all Go source changes
      - .:/src
      - go_cache:/root/go/pkg/mod
      - air_tmp:/tmp/air
      - ./plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["${DEV_API_PORT:-8081}:8080"]

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host"
    environment:
      API_HOST: "http://api:8080"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports: ["${DEV_WEB_PORT:-5174}:5173"]
    depends_on: [api]

  rustfs:
    image: rustfs/rustfs:latest
    command: >
      --address :9000
      --console-address :9001
      --console-enable
      --access-key ${DEV_S3_ACCESS_KEY:-rustfsadmin}
      --secret-key ${DEV_S3_SECRET_KEY:-rustfsadmin}
      /data
    profiles: ["s3"]
    environment:
      RUSTFS_ACCESS_KEY: "${DEV_S3_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${DEV_S3_SECRET_KEY:-rustfsadmin}"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${DEV_S3_PORT:-9000}:9000"
      - "${DEV_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_dev_data:/data
      - rustfs_dev_logs:/logs

  rustfs-init:
    image: amazon/aws-cli:latest
    profiles: ["s3"]
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: "${DEV_S3_ACCESS_KEY:-rustfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${DEV_S3_SECRET_KEY:-rustfsadmin}"
      AWS_DEFAULT_REGION: "us-east-1"
      DEV_S3_BUCKET: "${DEV_S3_BUCKET:-lrsolid}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 1
        done
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$DEV_S3_BUCKET" >/dev/null 2>&1 || true
        # The bucket stays private: exports are uploaded and downloaded by the
        # API using signed requests, never via anonymous access.
        aws --endpoint-url http://rustfs:9000 s3api delete-bucket-policy --bucket "$$DEV_S3_BUCKET" >/dev/null 2>&1 || true
        echo "bucket $$DEV_S3_BUCKET ready (private)"

volumes:
  postgres_dev_data:
  go_cache:
  air_tmp:
  web_node_modules:
  rustfs_dev_data:
  rustfs_dev_logs:
