# Local OpenID Connect provider for `docker compose --profile sso`.
# User: admin@example.com / password
# The issuer hostname is the Compose service name so the API container can
# fetch discovery. For a browser login, add `127.0.0.1 dex` to /etc/hosts.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: lrsolid
    redirectURIs:
      - "http://localhost:5174/api/auth/oidc/dex/callback"
    name: LRSolid
    secret: dev-dex-secret
enablePasswordDB: true
staticPasswords:
  - email: "admin@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
