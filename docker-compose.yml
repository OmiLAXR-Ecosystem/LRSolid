services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lrsolid
      POSTGRES_PASSWORD: lrsolid
      POSTGRES_DB: lrsolid
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrsolid"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8080"
      PG_DSN: "postgres://lrsolid:lrsolid@postgres:5432/lrsolid?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      DEFAULT_ORG: "${DEFAULT_ORG:-default}"
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres_data:
